<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login page -->
  <section id="login-page" class="card">
    <h1>Task Manager</h1>
    <p class="hint">Demo account: <b>demo</b> / <b>demo123</b></p>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="off" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" />
      <button type="submit" id="login-button">Login</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
  </section>

  <!-- Dashboard page -->
  <section id="dashboard-page" class="card" hidden>
    <div class="top">
      <h1 id="welcome-message"></h1>
      <button id="logout-button" class="secondary">Logout</button>
    </div>
    <form id="task-form" novalidate>
      <label for="task-input">New task</label>
      <div class="row">
        <input id="task-input" type="text" placeholder="e.g. Write login test cases" maxlength="100" />
        <button type="submit" id="add-task-button">Add task</button>
      </div>
    </form>
    <p id="task-error" class="error" role="alert"></p>
    <p id="task-counter">0 tasks, 0 completed</p>
    <ul id="task-list"></ul>
    <p id="empty-message">No tasks yet. Add your first task above.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
